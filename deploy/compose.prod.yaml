# Production deployment template.
# Set DEPLOY_IMAGE and authentication values in the deployment environment.
# This project does not publish a production image until deployment is validated.

services:
  app:
    image: ${DEPLOY_IMAGE:?Set DEPLOY_IMAGE to a reviewed image reference}
    container_name: blog-navigation
    init: true
    ports:
      # Public admin port 5678, deliberately bound on all interfaces per the confirmed
      # decision. This is plain HTTP: the admin password, session cookie and any
      # credentials entered in the browser can be intercepted in transit. That risk is
      # accepted for the first release; it is NOT mitigated by a strong password and
      # must be re-evaluated before any long-term production use.
      - "0.0.0.0:5678:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # Three independent persistent roots.
      BLOG_DATA_ROOT: /var/lib/guanlan/data
      BLOG_SECRET_ROOT: /var/lib/guanlan/secrets
      BLOG_BUILD_ROOT: /var/lib/guanlan/build
      # Master key for the at-rest App private key; injected by the deployment host only.
      BLOG_SECRET_KEY: ${BLOG_SECRET_KEY:-}
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://guanlangzg.github.io}
      EDITOR_ACCESS_TOKEN: ${EDITOR_ACCESS_TOKEN:-}
      EDITOR_RUNTIME_AUTH_SETUP_TOKEN: ${EDITOR_RUNTIME_AUTH_SETUP_TOKEN:-}
      # Required for the current plain-HTTP deployment; HttpOnly and SameSite stay on.
      COOKIE_SECURE: "false"
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      # Optional Cloudflare R2 secondary backup; GitHub is the primary destination.
      R2_BACKUP_ENABLED: ${R2_BACKUP_ENABLED:-false}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PREFIX: ${R2_PREFIX:-blog-navigation}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_SNAPSHOT_ON_WRITE: ${R2_SNAPSHOT_ON_WRITE:-false}
    volumes:
      # Never collapse these into one directory: content, credentials and the
      # rebuildable build workspace have different backup and retention rules.
      - ./data:/var/lib/guanlan/data
      - ./secrets:/var/lib/guanlan/secrets
      - ./build:/var/lib/guanlan/build
    tmpfs:
      - /tmp:size=256m,mode=1777,uid=1001,gid=1001
      - /app/management/.next/cache:size=256m,uid=1001,gid=1001,mode=0770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    restart: unless-stopped
    # Liveness only: GitHub/R2 failures surface as degraded readiness, not a restart loop.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Static builds run in-container, so allow more headroom than the old server-only image.
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
